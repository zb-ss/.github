name: Update Profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/readme-sections.json'
      - '.github/scripts/update-readme.js'
      - '.github/workflows/update-readme.yml'
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate project list
        uses: actions/github-script@v9
        with:
          script: |
            const updateReadme = require('./.github/scripts/update-readme.js');
            await updateReadme({
              github,
              org: context.repo.owner,
              readmePath: 'profile/README.md',
              configPath: '.github/readme-sections.json',
            });

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add profile/README.md && git commit -m "docs: update repo list" && git push)
